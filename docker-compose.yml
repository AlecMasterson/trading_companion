version: '3.8'
networks:
  network_main:
services:
  postgres:
    image: postgres:17.2
    container_name: postgres
    restart: always
    env_file:
      - .env
    networks:
      - network_main
    ports:
      - '5499:5432'
    volumes:
      - ./db/data:/var/lib/postgresql/data
      - ./db/scripts:/docker-entrypoint-initdb.d
  scripts:
    image: scripts-polygon:1.0.0
    container_name: scripts
    depends_on:
      - postgres
    env_file:
      .env
    networks:
      - network_main
    ports:
      - '8080:8080'
    stdin_open: true
    tty: true
    volumes:
      - ./bin:/app
