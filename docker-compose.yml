version: '3.8'

networks:
  network_main:

x-common-service: &common-service
  image: trading_companion:${VERSION}
  depends_on:
    - postgres
  env_file:
    .env
  networks:
    - network_main

services:
  api:
    <<: *common-service
    container_name: api
    ports:
      - '8080:8080'
  dagster:
    <<: *common-service
    container_name: dagster
    ports:
      - '3000:3000'
  postgres:
    image: postgres:17.2
    container_name: postgres
    restart: always
    env_file:
      - .env
    networks:
      - network_main
    ports:
      - '5432:5432'
    volumes:
      - ./db/data:/var/lib/postgresql/data
      - ./db/scripts:/docker-entrypoint-initdb.d
