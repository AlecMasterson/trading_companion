version: '3.8'
services:
  postgres:
    image: postgres:latest
    container_name: postgres
    restart: always
    env_file:
      - .env
    ports:
      - '5432:5432'
    volumes:
      - ./db:/docker-entrypoint-initdb.d/
      - postgres-data:/var/lib/postgresql/data
  scripts:
    image: scripts:1.0.0
    container_name: scripts
    depends_on:
      - postgres
    env_file:
      .env
    stdin_open: true
    tty: true
    volumes:
      - ./bin:/app
volumes:
  postgres-data:
