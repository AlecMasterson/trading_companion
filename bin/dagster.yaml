concurrency:
  default_op_concurrency_limit: 1
run_retries:
  enabled: false
storage:
  postgres:
    postgres_db:
      username: { env: DB_USERNAME }
      password: { env: DB_PASSWORD }
      hostname: { env: DB_HOST }
      db_name: trading_companion
      port: 5432
telemetry:
  enabled: false
